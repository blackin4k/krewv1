<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root{
--bg:#0A0A0C;
--surface:#151518;
--accent:#6F8CFF;
--text:#F2F2F7;
--muted:#9CA3AF;
}

body{
margin:0;
background:#111;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
font-family:Inter,sans-serif;
}

/* PHONE */

.phone{
width:390px;
height:800px;
background:black;
border-radius:48px;
padding:14px;
box-shadow:0 40px 80px rgba(0,0,0,0.8);
}

.screen{
width:100%;
height:100%;
background:var(--bg);
border-radius:36px;
overflow:hidden;
position:relative;
display:flex;
flex-direction:column;
}

.status{
height:40px;
display:flex;
align-items:center;
padding:0 18px;
font-size:14px;
color:var(--muted);
}

.content{
flex:1;
overflow-y:auto;
padding:20px 20px 200px;
color:var(--text);
}

/* HEADER */

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:24px;
}

.header h1{
font-size:22px;
font-weight:600;
}

/* SEARCH BAR */

.search-bar{
background:var(--surface);
border-radius:24px;
padding:14px 18px;
color:var(--muted);
margin-bottom:30px;
}

/* GENRE GRID */

.section-title{
font-size:16px;
font-weight:600;
margin-bottom:14px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:16px;
margin-bottom:36px;
}

.tile{
background:linear-gradient(
135deg,
rgba(111,140,255,0.4),
rgba(111,140,255,0.08)
);
border-radius:22px;
padding:28px 18px;
font-weight:600;
}

/* RESULT LIST */

.result{
display:flex;
align-items:center;
gap:14px;
background:var(--surface);
border-radius:20px;
padding:12px 14px;
margin-bottom:14px;
}

.result-art{
width:50px;
height:50px;
background:#222;
border-radius:14px;
}

.result-info{
flex:1;
}

.result-title{
font-size:14px;
font-weight:600;
}

.result-sub{
font-size:12px;
color:var(--muted);
}

/* MINI PLAYER */

.mini-player{
position:absolute;
bottom:72px;
left:16px;
right:16px;
background:rgba(21,21,24,0.95);
backdrop-filter:blur(20px);
border-radius:24px;
padding:14px 16px;
display:flex;
align-items:center;
gap:12px;
box-shadow:0 20px 60px rgba(0,0,0,0.6);
}

.mini-art{
width:46px;
height:46px;
background:#333;
border-radius:14px;
}

.mini-info{
flex:1;
}

.mini-title{
font-size:14px;
font-weight:600;
}

.mini-artist{
font-size:12px;
color:var(--muted);
}

.play-btn{
width:38px;
height:38px;
border-radius:50%;
background:var(--accent);
}

/* TAB BAR */

.tab-bar{
position:absolute;
bottom:0;
width:100%;
height:72px;
background:rgba(21,21,24,0.95);
backdrop-filter:blur(20px);
display:flex;
justify-content:space-around;
align-items:center;
font-size:12px;
}

.tab{
color:var(--muted);
}

.tab.active{
color:var(--accent);
}
</style>
</head>

<body>

<div class="phone">
<div class="screen">

<div class="status">9:41</div>

<div class="content">

<div class="header">
<h1>Search</h1>
</div>

<div class="search-bar">
Search songs, artists, albums...
</div>

<!-- GENRES -->

<div class="section-title">Browse by Genre</div>
<div class="grid">
<div class="tile">Pop</div>
<div class="tile">Hip-Hop</div>
<div class="tile">Indie</div>
<div class="tile">Chill</div>
<div class="tile">Workout</div>
<div class="tile">Focus</div>
</div>

<!-- TRENDING RESULTS -->

<div class="section-title">Trending Now</div>

<div class="result">
<div class="result-art"></div>
<div class="result-info">
<div class="result-title">Let Down</div>
<div class="result-sub">Radiohead • 1.2M plays</div>
</div>
</div>

<div class="result">
<div class="result-art"></div>
<div class="result-info">
<div class="result-title">505</div>
<div class="result-sub">Arctic Monkeys • 980K plays</div>
</div>
</div>

</div>

<div class="mini-player">
<div class="mini-art"></div>
<div class="mini-info">
<div class="mini-title">Let Down</div>
<div class="mini-artist">Radiohead</div>
</div>
<div class="play-btn"></div>
</div>

<div class="tab-bar">
<div class="tab">Home</div>
<div class="tab active">Search</div>
<div class="tab">Library</div>
<div class="tab">Activity</div>
<div class="tab">Profile</div>
</div>

</div>
</div>

</body>
</html>
