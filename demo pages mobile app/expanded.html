<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --text-primary: #FFFFFF;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-bg: rgba(255, 255, 255, 0.08);
            --accent-glow: rgba(160, 100, 120, 0.6);
        }

        body {
            margin: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Inter', sans-serif;
            color: var(--text-primary);
        }

        /* PHONE CONTAINER */
        .phone {
            width: 390px;
            height: 844px;
            /* iPhone 13/14 height */
            background: black;
            border-radius: 48px;
            padding: 12px;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.8);
            box-sizing: border-box;
            position: relative;
        }

        .screen {
            width: 100%;
            height: 100%;
            border-radius: 38px;
            overflow: hidden;
            position: relative;
            background: #121212;
            z-index: 1;
        }

        /* "iOS 26" DYNAMIC BACKGROUND */
        .mesh-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 50% -20%, #4a3b45, transparent 70%),
                radial-gradient(circle at 100% 40%, #2a2025, transparent 60%),
                radial-gradient(circle at 0% 80%, #3a3035, transparent 60%),
                #050505;
            filter: blur(40px);
            opacity: 0.8;
        }

        .noise-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.05;
            z-index: -1;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* TOP SAFE AREA */
        .top-area {
            padding-top: 50px;
            /* Status bar space */
            padding-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-left: 24px;
            padding-right: 24px;
        }

        .drag-indicator {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 36px;
            height: 5px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
        }

        .top-control {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            backdrop-filter: blur(10px);
            font-size: 14px;
            color: var(--text-primary);
        }

        .playing-from {
            font-size: 11px;
            letter-spacing: 1px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        /* ARTWORK */
        .art-container {
            display: flex;
            justify-content: center;
            margin-top: 10px;
            perspective: 1000px;
        }

        .art {
            width: 320px;
            height: 320px;
            border-radius: 28px;
            background: url('https://images.unsplash.com/photo-1497032628192-86f99bcd76bc?auto=format&fit=crop&w=800&q=80');
            background-size: cover;
            background-position: center;
            box-shadow: 0 20px 60px rgba(160, 100, 120, 0.4);
            /* Diffuse colored glow */
            position: relative;
        }

        /* SONG INFO */
        .song-info {
            padding: 40px 32px 0;
            text-align: left;
        }

        .song-title {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-artist {
            font-size: 18px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        /* PROGRESS */
        .progress-container {
            padding: 30px 32px 10px;
        }

        .progress-bar-bg {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            position: relative;
        }

        .progress-fill {
            width: 45%;
            height: 100%;
            background: white;
            border-radius: 10px;
            position: relative;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        .progress-knob {
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%) scale(0);
            /* Hidden by default, show on hover/drag */
            width: 12px;
            height: 12px;
            background: white;
            border-radius: 50%;
            transition: transform 0.2s;
        }

        .time-row {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            font-variant-numeric: tabular-nums;
        }

        /* CONTROLS */
        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 24px;
            margin-top: 10px;
        }

        .control-btn {
            font-size: 26px;
            color: white;
            opacity: 0.9;
            background: none;
            border: none;
            cursor: pointer;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .control-btn.secondary {
            font-size: 22px;
            color: var(--text-secondary);
        }

        .control-btn.secondary.active {
            color: var(--accent-glow);
            text-shadow: 0 0 10px var(--accent-glow);
        }

        .play-btn {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            box-shadow:
                inset 0 0 0 1px rgba(255, 255, 255, 0.1),
                0 10px 30px rgba(0, 0, 0, 0.3);
            transition: transform 0.1s;
        }

        .play-btn:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.2);
        }

        /* BOTTOM ACTIONS */
        .bottom-actions {
            display: flex;
            justify-content: space-between;
            padding: 0 40px;
            margin-top: 20px;
        }

        .action-btn {
            font-size: 20px;
            color: var(--text-secondary);
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            background: transparent;
            transition: background 0.2s;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
        }
    </style>
</head>

<body>

    <div class="phone">
        <div class="screen">
            <div class="mesh-bg"></div>
            <div class="noise-overlay"></div>

            <div class="drag-indicator"></div>

            <div class="top-area">
                <div class="top-control">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 12H5" />
                        <path d="M12 19l-7-7 7-7" />
                    </svg>
                </div>
                <div class="playing-from">Playing From Library</div>
                <div class="top-control" style="background:none;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="1" />
                        <circle cx="19" cy="12" r="1" />
                        <circle cx="5" cy="12" r="1" />
                    </svg>
                </div>
            </div>

            <div class="art-container">
                <div class="art"></div>
            </div>

            <div class="song-info">
                <div class="song-title">All Of Me</div>
                <div class="song-artist">Nao</div>
            </div>

            <div class="progress-container">
                <div class="progress-bar-bg">
                    <div class="progress-fill">
                        <div class="progress-knob"></div>
                    </div>
                </div>
                <div class="time-row">
                    <div>1:41</div>
                    <div>-1:04</div>
                </div>
            </div>

            <div class="controls-row">
                <!-- Shuffle -->
                <div class="control-btn secondary">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M16 3h5v5" />
                        <path d="M4 20L21 3" />
                        <path d="M21 16v5h-5" />
                        <path d="M15 15l6 6" />
                        <path d="M4 4l5 5" />
                    </svg>
                </div>

                <!-- Previous -->
                <div class="control-btn">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M19 20L9 12l10-8v16zM5 19h2V5H5v14z" />
                    </svg>
                </div>

                <!-- Play -->
                <div class="play-btn">
                    <svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M8 5v14l11-7z" />
                    </svg>
                </div>

                <!-- Next -->
                <div class="control-btn">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M5 4l10 8-10 8V4zM19 5h2v14h-2V5z" />
                    </svg>
                </div>

                <!-- Repeat -->
                <div class="control-btn secondary">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M17 1l4 4-4 4" />
                        <path d="M3 11V9a4 4 0 0 1 4-4h14" />
                        <path d="M7 23l-4-4 4-4" />
                        <path d="M21 13v2a4 4 0 0 1-4 4H3" />
                    </svg>
                </div>
            </div>

            <div class="bottom-actions">
                <!-- Lyrics -->
                <div class="action-btn">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
                    </svg>
                </div>

                <!-- Airplay -->
                <div class="action-btn">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 17H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-1" />
                        <polygon points="12 15 17 21 7 21 12 15" />
                    </svg>
                </div>

                <!-- List/Queue -->
                <div class="action-btn">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="8" y1="6" x2="21" y2="6" />
                        <line x1="8" y1="12" x2="21" y2="12" />
                        <line x1="8" y1="18" x2="21" y2="18" />
                        <line x1="3" y1="6" x2="3.01" y2="6" />
                        <line x1="3" y1="12" x2="3.01" y2="12" />
                        <line x1="3" y1="18" x2="3.01" y2="18" />
                    </svg>
                </div>
            </div>

        </div>
    </div>

</body>

</html>
