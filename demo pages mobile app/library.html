<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root{
--bg:#0A0A0C;
--surface:#151518;
--accent:#6F8CFF;
--text:#F2F2F7;
--muted:#9CA3AF;
}

body{
margin:0;
background:#111;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
font-family:Inter,sans-serif;
}

/* PHONE */

.phone{
width:390px;
height:800px;
background:black;
border-radius:48px;
padding:14px;
box-shadow:0 40px 80px rgba(0,0,0,0.8);
}

.screen{
width:100%;
height:100%;
background:var(--bg);
border-radius:36px;
overflow:hidden;
position:relative;
display:flex;
flex-direction:column;
}

.status{
height:40px;
display:flex;
align-items:center;
padding:0 18px;
font-size:14px;
color:var(--muted);
}

.content{
flex:1;
overflow-y:auto;
padding:20px 20px 200px;
color:var(--text);
}

/* HEADER */

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.header h1{
font-size:22px;
font-weight:600;
}

/* FILTER CHIPS */

.chips{
display:flex;
gap:10px;
margin-bottom:20px;
overflow-x:auto;
}

.chip{
padding:8px 14px;
border-radius:20px;
background:var(--surface);
font-size:12px;
color:var(--muted);
white-space:nowrap;
}

.chip.active{
background:var(--accent);
color:white;
}

/* LIST STYLE */

.list-item{
display:flex;
align-items:center;
gap:14px;
padding:10px 0;
border-bottom:1px solid rgba(255,255,255,0.04);
}

.list-art{
width:58px;
height:58px;
background:#222;
border-radius:14px;
}

.list-info{
flex:1;
}

.list-title{
font-size:15px;
font-weight:600;
}

.list-sub{
font-size:12px;
color:var(--muted);
margin-top:3px;
}

/* MINI PLAYER */

.mini-player{
position:absolute;
bottom:72px;
left:16px;
right:16px;
background:rgba(21,21,24,0.95);
backdrop-filter:blur(20px);
border-radius:24px;
padding:14px 16px;
display:flex;
align-items:center;
gap:12px;
box-shadow:0 20px 60px rgba(0,0,0,0.6);
}

.mini-art{
width:46px;
height:46px;
background:#333;
border-radius:14px;
}

.mini-info{
flex:1;
}

.mini-title{
font-size:14px;
font-weight:600;
}

.mini-artist{
font-size:12px;
color:var(--muted);
}

.play-btn{
width:38px;
height:38px;
border-radius:50%;
background:var(--accent);
}

/* TAB BAR */

.tab-bar{
position:absolute;
bottom:0;
width:100%;
height:72px;
background:rgba(21,21,24,0.95);
backdrop-filter:blur(20px);
display:flex;
justify-content:space-around;
align-items:center;
font-size:12px;
}

.tab{
color:var(--muted);
}

.tab.active{
color:var(--accent);
}
</style>
</head>

<body>

<div class="phone">
<div class="screen">

<div class="status">9:41</div>

<div class="content">

<div class="header">
<h1>Your Library</h1>
</div>

<!-- FILTERS -->

<div class="chips">
<div class="chip active">Playlists</div>
<div class="chip">Artists</div>
<div class="chip">Albums</div>
<div class="chip">Songs</div>
<div class="chip">Downloaded</div>
</div>

<!-- LIST ITEMS -->

<div class="list-item">
<div class="list-art"></div>
<div class="list-info">
<div class="list-title">Liked Songs</div>
<div class="list-sub">128 songs</div>
</div>
</div>

<div class="list-item">
<div class="list-art"></div>
<div class="list-info">
<div class="list-title">Chill Nights</div>
<div class="list-sub">32 songs</div>
</div>
</div>

<div class="list-item">
<div class="list-art"></div>
<div class="list-info">
<div class="list-title">Gym Mode</div>
<div class="list-sub">45 songs</div>
</div>
</div>

<div class="list-item">
<div class="list-art"></div>
<div class="list-info">
<div class="list-title">Late Night Energy</div>
<div class="list-sub">Personalized</div>
</div>
</div>

<div class="list-item">
<div class="list-art"></div>
<div class="list-info">
<div class="list-title">Focus Flow</div>
<div class="list-sub">24 songs</div>
</div>
</div>

</div>

<div class="mini-player">
<div class="mini-art"></div>
<div class="mini-info">
<div class="mini-title">Let Down</div>
<div class="mini-artist">Radiohead</div>
</div>
<div class="play-btn"></div>
</div>

<div class="tab-bar">
<div class="tab">Home</div>
<div class="tab">Search</div>
<div class="tab active">Library</div>
<div class="tab">Activity</div>
<div class="tab">Profile</div>
</div>

</div>
</div>

</body>
</html>
