<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Krew Carousel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: Inter, sans-serif;
            background: #0b0b0b;
            display: flex;
            flex-direction: column;
            gap: 80px;
            padding: 80px;
            align-items: center;
        }

        .slide {
            width: 1080px;
            height: 1080px;
            position: relative;
            overflow: hidden;
        }

        .glow {
            position: absolute;
            width: 600px;
            height: 600px;
            filter: blur(220px);
            opacity: .3;
        }
    </style>
</head>

<body>

    <!-- SLIDE 1 -->
    <div class="slide bg-black text-white flex flex-col justify-center items-center text-center">
        <div class="glow bg-purple-500 top-[-200px] right-[-200px]"></div>
        <h1 class="text-[10rem] font-black leading-none">MUSIC</h1>
        <h2 class="text-6xl text-gray-400 mt-6">without limits</h2>
        <p class="mt-20 text-4xl font-bold text-purple-400">Meet Krew</p>
    </div>

    <!-- SLIDE 2 -->
    <div class="slide bg-gradient-to-br from-zinc-900 to-black text-white flex flex-col justify-center p-28">
        <h1 class="text-8xl font-black mb-20">WHY KREW?</h1>
        <div class="space-y-10 text-5xl font-bold text-gray-300">
            <div>🚫 No Ads</div>
            <div>⚡ Lightning Fast</div>
            <div>🎧 High Quality Audio</div>
            <div>✨ Clean UI</div>
            <div>🧑‍💻 Built by One Dev</div>
        </div>
    </div>

    <!-- SLIDE 3 -->
    <div class="slide bg-black text-white flex flex-col justify-between p-24">
        <div class="glow bg-blue-500 top-[-150px] left-[-150px]"></div>

        <h1 class="text-9xl font-black leading-tight">
            FEEL<br>THE MUSIC
        </h1>

        <div class="text-4xl text-gray-400 max-w-3xl">
            Built for people who actually care about sound, speed and experience.
        </div>

        <div class="text-purple-400 text-3xl font-mono">
            #JoinTheKrew
        </div>
    </div>

    <!-- SLIDE 4 -->
    <div
        class="slide relative text-white flex flex-col justify-center items-center text-center bg-gradient-to-br from-purple-900 via-black to-black">

        <h1 class="text-[9rem] font-black mb-12">READY?</h1>
        <p class="text-4xl text-gray-300 mb-20 max-w-2xl">
            The future of music streaming starts now.
        </p>

        <div class="bg-white text-black text-5xl font-black py-8 px-24 rounded-full">
            GET KREW
        </div>

        <p class="mt-16 text-3xl text-purple-400 font-mono">
            krew.app
        </p>

    </div>

</body>

</html>
