<!DOCTYPE html>
<html>

<head>
    <title>Krew</title>
    <style>
        body {
            background: black;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: system-ui;
            text-align: center;
            overflow: hidden;
        }

        .glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: purple;
            filter: blur(200px);
            opacity: 0.3;
            top: -200px;
            right: -200px;
        }

        h1 {
            font-size: 130px;
            font-weight: 900;
            margin: 0;
            letter-spacing: -3px;
        }

        p {
            font-size: 32px;
            color: #aaa;
        }

        .btn {
            margin-top: 40px;
            background: white;
            color: black;
            padding: 18px 50px;
            border-radius: 50px;
            font-size: 26px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="glow"></div>

    <div>
        <h1>KREW</h1>
        <p>No ads. Just music.</p>
        <div class="btn">Get Started</div>
    </div>

</body>

</html>
