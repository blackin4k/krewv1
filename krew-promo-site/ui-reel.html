<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krew UI Reel V2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        :root {
            --neon-purple: #b026ff;
            --neon-green: #00ff9d;
            --neon-cyan: #00f0ff;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            background-color: #000;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            perspective: 2000px;
            /* Enable 3D space */
        }

        .stage {
            width: 1080px;
            height: 1920px;
            background: #000;
            position: relative;
            overflow: hidden;
            /* 3D Transform Context */
            transform-style: preserve-3d;
        }

        /* --- DYNAMIC BACKGROUND --- */
        .bg-mesh {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background:
                radial-gradient(circle at 50% 50%, rgba(118, 38, 255, 0.15), transparent 60%),
                radial-gradient(circle at 80% 20%, rgba(0, 255, 157, 0.1), transparent 50%),
                radial-gradient(circle at 20% 80%, rgba(0, 240, 255, 0.1), transparent 50%);
            z-index: 0;
            animation: bgFloat 10s ease-in-out infinite alternate;
            opacity: 0.6;
        }

        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(#fff 1px, transparent 1px);
            background-size: 50px 50px;
            opacity: 0.1;
            z-index: 1;
            animation: particleScroll 20s linear infinite;
        }

        /* --- PHONE FRAME (3D) --- */
        .phone-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            /* Centered initially */
            width: 900px;
            height: 1800px;
            transform-style: preserve-3d;
            z-index: 10;
        }

        .phone-frame {
            width: 100%;
            height: 100%;
            background: #000;
            border-radius: 60px;
            border: 8px solid #222;
            box-shadow:
                0 0 0 4px #000,
                /* Inner bezel */
                0 20px 50px rgba(0, 0, 0, 0.5),
                /* Drop shadow */
                0 0 100px rgba(176, 38, 255, 0.15);
            /* Glow */
            overflow: hidden;
            position: relative;
        }

        /* --- UI LAYOUT --- */
        .screen-content {
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #0a0a0a 0%, #000 100%);
            position: relative;
        }

        /* FEED */
        .feed-layer {
            position: absolute;
            inset: 0;
            padding: 120px 40px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .feed-header {
            font-size: 48px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 20px;
            opacity: 0;
            transform: translateY(-20px);
        }

        .song-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 25px;
            display: flex;
            align-items: center;
            gap: 30px;
            backdrop-filter: blur(20px);
            transform: translateY(200px);
            /* Start low */
            opacity: 1;
            /* Managed by anim */
            transition: transform 0.1s;
        }

        .card-img {
            width: 150px;
            height: 150px;
            border-radius: 20px;
            object-fit: cover;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        /* PLAYER HERO */
        .player-layer {
            position: absolute;
            inset: 0;
            z-index: 50;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 180px;
            background: radial-gradient(circle at center top, #1a1a1a, #000);
            clip-path: circle(0% at 50% 60%);
            /* Transition Origin */
            opacity: 0;
        }

        .hero-art-container {
            width: 750px;
            height: 750px;
            border-radius: 40px;
            position: relative;
            transform-style: preserve-3d;
            perspective: 1000px;
        }

        .hero-art {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 40px;
            box-shadow: 0 30px 80px rgba(0, 255, 128, 0.1);
            position: relative;
            z-index: 2;
        }

        .hero-glow-back {
            position: absolute;
            inset: -20px;
            background: linear-gradient(45deg, var(--neon-purple), var(--neon-green));
            border-radius: 50px;
            filter: blur(40px);
            opacity: 0.4;
            z-index: 1;
            animation: pulseGlow 2s infinite alternate;
        }

        /* VISUALIZER BARS */
        .vis-bar-container {
            display: flex;
            gap: 12px;
            height: 100px;
            align-items: flex-end;
            margin-top: 60px;
            opacity: 0;
            /* Fade in */
        }

        .vis-bar {
            width: 12px;
            background: var(--neon-green);
            border-radius: 6px;
            animation: equalizer 0.8s ease-in-out infinite alternate;
        }

        /* LAB OVERLAY */
        .lab-layer {
            position: absolute;
            inset: 0;
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(40px);
            z-index: 60;
            transform: translateX(100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 60px;
        }

        /* TEXT OVERLAYS (Floating above phone) */
        .text-overlay {
            position: absolute;
            bottom: 350px;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 100;
            text-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            transform: translateZ(100px);
            /* Lifted off "screen" in 3D */
            pointer-events: none;
        }

        .big-text {
            font-size: 80px;
            font-weight: 900;
            color: #fff;
            letter-spacing: -3px;
            line-height: 0.9;
        }

        .neon-accent {
            color: var(--neon-green);
            text-shadow: 0 0 20px rgba(0, 255, 157, 0.4);
        }

        /* OUTRO */
        .outro-layer {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 200;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
        }

        /* --- ANIMATIONS --- */

        /* Background */
        @keyframes bgFloat {
            to {
                transform: scale(1.1);
            }
        }

        @keyframes particleScroll {
            to {
                background-position: 0 1000px;
            }
        }

        /* 3D Phone Movements (Timeline) */
        /* 0-5s: Slight tilt left */
        /* 5-10s: Tilt straight for player */
        /* 10-15s: Tilt right for Lab */

        .anim-phone-move {
            animation: phoneSequence 30s ease-in-out forwards;
        }

        @keyframes phoneSequence {
            0% {
                transform: translate(-50%, -50%) rotateY(0deg) rotateX(0deg) scale(0.9);
                opacity: 0;
            }

            5% {
                transform: translate(-50%, -50%) rotateY(-5deg) rotateX(5deg) scale(1);
                opacity: 1;
            }

            15% {
                transform: translate(-50%, -50%) rotateY(-5deg) rotateX(5deg) scale(1);
            }

            /* Hold */
            25% {
                transform: translate(-50%, -50%) rotateY(0deg) rotateX(0deg) scale(1.05);
            }

            /* Center for player */
            50% {
                transform: translate(-50%, -50%) rotateY(0deg) rotateX(0deg) scale(1.05);
            }

            60% {
                transform: translate(-50%, -50%) rotateY(10deg) rotateX(2deg) scale(1);
            }

            /* Lab tilt */
            80% {
                transform: translate(-50%, -50%) rotateY(0deg) rotateX(0deg) scale(1);
            }

            95% {
                transform: translate(-50%, -50%) scale(0.9);
                opacity: 0;
            }

            100% {
                opacity: 0;
            }
        }

        /* Feed Items (Staggered Bounce) */
        .anim-feed-item {
            animation: feedItemEnter 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes feedItemEnter {
            0% {
                transform: translateY(300px) scale(0.9);
                opacity: 0;
            }

            100% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }

        /* Tap Interaction (Explosive) */
        .anim-tap {
            animation: tapExplode 0.4s ease-out forwards;
        }

        @keyframes tapExplode {
            0% {
                transform: scale(1);
                background: var(--glass-bg);
            }

            40% {
                transform: scale(0.95);
                background: rgba(255, 255, 255, 0.2);
                border-color: #fff;
            }

            100% {
                transform: scale(1);
                background: var(--glass-bg);
            }
        }

        /* Player Explode Transition */
        .anim-player-enter {
            animation: playerExplodeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes playerExplodeIn {
            0% {
                clip-path: circle(0% at 50% 60%);
                opacity: 1;
            }

            100% {
                clip-path: circle(150% at 50% 50%);
                opacity: 1;
            }
        }

        /* Hero Art Pop */
        .anim-hero-pop {
            animation: heroPop 1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes heroPop {
            0% {
                transform: scale(0.5) rotateX(20deg);
                opacity: 0;
            }

            100% {
                transform: scale(1) rotateX(0deg);
                opacity: 1;
            }
        }

        @keyframes pulseGlow {
            to {
                opacity: 0.8;
                filter: blur(60px);
            }
        }

        /* Lab Slide */
        .anim-lab-enter {
            animation: labSlideIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes labSlideIn {
            to {
                transform: translateX(0);
            }
        }

        /* Lab Slide Out */
        .anim-lab-exit {
            animation: labSlideOut 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes labSlideOut {
            to {
                transform: translateX(100%);
            }
        }

        /* Text Effects */
        .anim-text-slam {
            animation: textSlam 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes textSlam {
            0% {
                transform: translateY(100px) scale(1.5);
                opacity: 0;
                filter: blur(20px);
            }

            100% {
                transform: translateY(0) scale(1);
                opacity: 1;
                filter: blur(0);
            }
        }

        .anim-text-out {
            animation: textOut 0.4s ease-in forwards;
        }

        @keyframes textOut {
            to {
                transform: translateY(-50px) scale(0.9);
                opacity: 0;
                filter: blur(10px);
            }
        }

        /* Outro Shockwave */
        .anim-outro-enter {
            animation: fadeToBlack 0.1s linear forwards;
        }

        @keyframes fadeToBlack {
            to {
                opacity: 1;
            }
        }

        .anim-logo-reveal {
            animation: logoShockwave 2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes logoShockwave {
            0% {
                transform: scale(0) rotate(-180deg);
                opacity: 0;
            }

            50% {
                transform: scale(1.2) rotate(0deg);
                opacity: 1;
            }

            70% {
                transform: scale(1);
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* EQ Bars */
        @keyframes equalizer {
            0% {
                height: 20px;
            }

            100% {
                height: 100%;
            }
        }

        /* Sliders */
        @keyframes sliderMove {
            0% {
                bottom: 20%;
            }

            100% {
                bottom: 80%;
            }
        }

        /* --- TIMELINE DELAYS --- */
        /* Controlled via classes added to elements */
    </style>
</head>

<body>

    <div class="stage">
        <!-- Background -->
        <div class="bg-mesh"></div>
        <div class="particles"></div>

        <!-- 3D Phone Container -->
        <div class="phone-container anim-phone-move">
            <div class="phone-frame">
                <div class="screen-content">

                    <!-- FEED LAYER -->
                    <div class="feed-layer">
                        <div class="feed-header"
                            style="animation: feedItemEnter 0.8s cubic-bezier(0.34,1.56,0.64,1) forwards 1s">
                            Good Evening
                        </div>

                        <!-- Cards -->
                        <div class="song-card"
                            style="animation: feedItemEnter 0.8s cubic-bezier(0.34,1.56,0.64,1) forwards 1.1s">
                            <img src="song_images/streets.webp" class="card-img"
                                onerror="this.src='https://placehold.co/150?text=1'">
                            <div>
                                <div class="text-3xl font-bold text-white">Streets</div>
                                <div class="text-xl text-gray-400">Doja Cat</div>
                            </div>
                        </div>

                        <!-- TARGET CARD (Wait for Tap) -->
                        <div class="song-card target-card"
                            style="animation: feedItemEnter 0.8s cubic-bezier(0.34,1.56,0.64,1) forwards 1.2s; position: relative;">
                            <img src="song_images/505.webp" class="card-img"
                                onerror="this.src='https://placehold.co/150?text=2'">
                            <div>
                                <div class="text-3xl font-bold text-white">505</div>
                                <div class="text-xl text-gray-400">Arctic Monkeys</div>
                            </div>
                            <!-- Tap Ripple Effect Mock -->
                            <div class="absolute inset-0 bg-white opacity-0 rounded-[28px]"
                                style="animation: tapExplode 0.4s ease-out forwards 7.5s"></div>
                        </div>

                        <div class="song-card"
                            style="animation: feedItemEnter 0.8s cubic-bezier(0.34,1.56,0.64,1) forwards 1.3s">
                            <img src="song_images/high on u.webp" class="card-img"
                                onerror="this.src='https://placehold.co/150?text=3'">
                            <div>
                                <div class="text-3xl font-bold text-white">High On You</div>
                                <div class="text-xl text-gray-400">Jind Universe</div>
                            </div>
                        </div>

                        <div class="song-card"
                            style="animation: feedItemEnter 0.8s cubic-bezier(0.34,1.56,0.64,1) forwards 1.4s">
                            <img src="song_images/exit music(for a flim).png" class="card-img"
                                onerror="this.src='https://placehold.co/150?text=4'">
                            <div>
                                <div class="text-3xl font-bold text-white">Exit Music</div>
                                <div class="text-xl text-gray-400">Radiohead</div>
                            </div>
                        </div>
                    </div>

                    <!-- PLAYER LAYER (Entered at 8s) -->
                    <div class="player-layer"
                        style="animation: playerExplodeIn 0.8s cubic-bezier(0.16,1,0.3,1) forwards 8s; animation-fill-mode: forwards;">
                        <!-- Exit animation triggered later via separate style or JS if needed, but for simplicity we layer on top -->

                        <div class="hero-art-container"
                            style="animation: heroPop 1s cubic-bezier(0.34,1.56,0.64,1) forwards 8.2s">
                            <div class="hero-glow-back"></div>
                            <img src="song_images/505.webp" class="hero-art"
                                onerror="this.src='https://placehold.co/750?text=HERO'">
                        </div>

                        <div class="text-center mt-12" style="animation: textSlam 0.5s forwards 8.4s; opacity: 0;">
                            <h1 class="text-6xl font-black text-white mb-4 tracking-tight">505</h1>
                            <p class="text-4xl text-gray-400 font-medium">Arctic Monkeys</p>
                        </div>

                        <div class="vis-bar-container" style="animation: fadeToBlack 0.5s forwards 8.6s; opacity: 0;">
                            <!-- Generate bars -->
                            <div class="vis-bar" style="height: 40px; animation-delay: 0s"></div>
                            <div class="vis-bar" style="height: 70px; animation-delay: 0.1s"></div>
                            <div class="vis-bar" style="height: 90px; animation-delay: 0.2s"></div>
                            <div class="vis-bar" style="height: 50px; animation-delay: 0.3s"></div>
                            <div class="vis-bar" style="height: 80px; animation-delay: 0.1s"></div>
                            <div class="vis-bar" style="height: 60px; animation-delay: 0.4s"></div>
                            <div class="vis-bar" style="height: 40px; animation-delay: 0.2s"></div>
                        </div>
                    </div>

                    <!-- LAB LAYER (Enters at 18s, Exits at 24s) -->
                    <div class="lab-layer"
                        style="animation: labSlideIn 0.8s cubic-bezier(0.16,1,0.3,1) forwards 18s, labSlideOut 0.6s cubic-bezier(0.16,1,0.3,1) forwards 24s">
                        <div class="text-5xl font-mono text-cyan-400 mb-6 tracking-widest">/// THE LAB</div>
                        <h1 class="text-7xl font-bold text-white mb-16">Audio Control</h1>

                        <!-- Animated Sliders -->
                        <div class="flex justify-between h-[400px] items-center">
                            <div class="w-4 bg-gray-800 h-full rounded-full relative">
                                <div class="absolute bottom-[20%] left-1/2 -translate-x-1/2 w-12 h-12 bg-white rounded-full shadow-[0_0_20px_white]"
                                    style="animation: sliderMove 2s infinite alternate"></div>
                            </div>
                            <div class="w-4 bg-gray-800 h-full rounded-full relative">
                                <div class="absolute bottom-[60%] left-1/2 -translate-x-1/2 w-12 h-12 bg-white rounded-full shadow-[0_0_20px_white]"
                                    style="animation: sliderMove 3s infinite alternate-reverse"></div>
                            </div>
                            <div class="w-4 bg-gray-800 h-full rounded-full relative">
                                <div class="absolute bottom-[40%] left-1/2 -translate-x-1/2 w-12 h-12 bg-cyan-400 rounded-full shadow-[0_0_20px_cyan]"
                                    style="animation: sliderMove 1.5s infinite alternate"></div>
                            </div>
                            <div class="w-4 bg-gray-800 h-full rounded-full relative">
                                <div class="absolute bottom-[70%] left-1/2 -translate-x-1/2 w-12 h-12 bg-white rounded-full shadow-[0_0_20px_white]"
                                    style="animation: sliderMove 2.5s infinite alternate-reverse"></div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>

        <!-- TEXT OVERLAYS SEQUENCE -->
        <!-- 1. Hook (1-4s) -->
        <div class="text-overlay" style="animation: textSlam 0.5s forwards 1.5s, textOut 0.5s forwards 4s; opacity: 0;">
            <div class="big-text">Music.<br>But <span class="neon-accent">Smarter.</span></div>
        </div>

        <!-- 2. Sync (4-8s) -->
        <div class="text-overlay"
            style="animation: textSlam 0.5s forwards 4.5s, textOut 0.5s forwards 7.8s; opacity: 0;">
            <div class="big-text">Your vibe.<br>In Sync.</div>
        </div>

        <!-- 3. Player Hero (8-13s) -->
        <div class="text-overlay"
            style="animation: textSlam 0.5s forwards 9s, textOut 0.5s forwards 13s; opacity: 0; bottom: 300px;">
            <div class="big-text neon-accent text-5xl">LIVE SYNC</div>
        </div>

        <!-- 4. Emotion (13-18s) -->
        <div class="text-overlay"
            style="animation: textSlam 0.5s forwards 13.5s, textOut 0.5s forwards 17.5s; opacity: 0;">
            <div class="big-text" style="font-size: 50px;">Feel every beat.</div>
        </div>

        <!-- 5. Lab (18-24s) -->
        <div class="text-overlay"
            style="animation: textSlam 0.5s forwards 18.5s, textOut 0.5s forwards 23.5s; opacity: 0; bottom: 250px;">
            <div class="big-text">Shape<br>Your Sound.</div>
        </div>

        <!-- 6. No Breaks (24-28s) -->
        <div class="text-overlay"
            style="animation: textSlam 0.5s forwards 24.5s, textOut 0.5s forwards 28s; opacity: 0;">
            <div class="big-text">No Breaks.</div>
        </div>

        <!-- OUTRO (28s+) -->
        <div class="outro-layer" style="animation: fadeToBlack 0.1s forwards 28s">
            <div class="text-center"
                style="animation: logoShockwave 1s cubic-bezier(0.16,1,0.3,1) forwards 28.2s; opacity: 0;">
                <img src="yeah.svg"
                    style="height: 200px; margin-bottom: 40px; filter: drop-shadow(0 0 50px rgba(176,38,255,0.5));">
                <h1 class="text-8xl font-black text-white tracking-tighter">KREW</h1>
                <p class="text-3xl text-gray-500 mt-8 font-mono">krew.app</p>
            </div>
        </div>

    </div>

</body>

</html>
