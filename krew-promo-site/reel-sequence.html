<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krew Reel - Intro Sequence</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- STAGE --- */
        .stage {
            width: 1080px;
            height: 1920px;
            /* 9:16 Ratio for Reels */
            background: #050505;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 100px rgba(255, 255, 255, 0.05);
            display: flex;
            /* Centering for intro elements */
            justify-content: center;
            align-items: center;
        }

        /* --- INTRO LAYERS --- */
        .intro-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            background: #000;
            animation: layerFadeOut 0.5s ease forwards 1.8s;
            /* Keep layer exit */
        }

        .intro-logo {
            width: 200px;
            height: auto;
            opacity: 0;
            animation: logoSequence 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards 0.3s;
        }

        .intro-text-container {
            position: absolute;
            text-align: center;
        }

        .intro-text {
            font-size: 120px;
            font-weight: 900;
            color: white;
            text-transform: uppercase;
            line-height: 0.9;
            opacity: 0;
            transform: scale(1.5);
            letter-spacing: -5px;
        }

        /* Text starts at 0.5s, after logo ends at 0.5s */
        .t-most {
            animation: textPunch 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards 0.9s;
        }

        .t-played {
            animation: textPunch 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards 1.1s;
            color: #1db954;
        }

        /* --- MAIN CONTENT (Stats) --- */
        .stats-content {
            width: 100%;
            height: 100%;
            padding: 120px 60px;
            display: flex;
            flex-direction: column;
            opacity: 0;
            /* Fade in at 2.0s, Start fade out at 6.5s */
            animation: contentSequence 5s ease forwards 2.0s;
        }

        /* ... (styles unchanged) ... */

        /* --- OUTRO LAYERS --- */
        .outro-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            /* Outro starts at 7.0s, adds gentle float */
            animation: outroFadeIn 0.8s ease forwards 7.0s,
                float 3s ease-in-out infinite 8.0s;
        }

        .outro-text {
            font-size: 90px;
            font-weight: 900;
            color: white;
            text-align: center;
            line-height: 1.1;
            margin-bottom: 40px;
            transform: translateY(20px);
            opacity: 0;
            animation: outroTextUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards 7.2s;
        }

        .outro-sub {
            font-size: 40px;
            color: #1db954;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0;
            animation: outroTextUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards 7.5s;
        }

        .outro-logo {
            width: 120px;
            margin-top: 60px;
            opacity: 0;
            animation: fadeIn 1s ease forwards 8.0s;
        }

        /* ANIMATIONS */
        @keyframes float {
            0% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }

            100% {
                transform: translateY(0);
            }
        }

        @keyframes logoSequence {
            0% {
                opacity: 0;
                transform: scale(0.8);
            }

            20% {
                opacity: 1;
                transform: scale(1.1);
            }

            60% {
                opacity: 1;
                transform: scale(1.1);
            }

            100% {
                opacity: 0;
                transform: scale(1.3);
                filter: blur(0);
            }
        }

        @keyframes textPunch {
            0% {
                opacity: 0;
                transform: scale(3);
                filter: blur(20px);
            }

            100% {
                opacity: 1;
                transform: scale(1);
                filter: blur(0);
            }
        }

        @keyframes layerFadeOut {
            to {
                opacity: 0;
                visibility: hidden;
            }
        }

        @keyframes contentFadeIn {
            to {
                opacity: 1;
            }
        }

        @keyframes listEntry {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fillBar {
            to {
                width: var(--target-width);
            }
        }

        /* NEW ANIMATIONS FOR OUTRO */
        @keyframes outroFadeIn {
            to {
                opacity: 1;
            }
        }

        @keyframes outroTextUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        /* Modified contentSequence to fade out */
        @keyframes contentSequence {
            0% {
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
                transform: scale(1);
                filter: blur(0);
            }

            100% {
                opacity: 0;
                transform: scale(0.95);
                filter: blur(10px);
            }
        }

        /* --- UTILS --- */
        .replay-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 15px 30px;
            background: #222;
            color: #fff;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            opacity: 0.3;
            transition: opacity 0.3s;
            z-index: 200;
        }

        .replay-btn:hover {
            opacity: 1;
        }
    </style>
</head>

<body>

    <button class="replay-btn" onclick="replayAnimation()">↺ Replay Animation</button>

    <script>
        function playSound(id, delay) {
            setTimeout(() => {
                const audio = document.getElementById(id);
                if (audio) {
                    audio.currentTime = 0;
                    audio.play().catch(e => console.log('Audio play failed (user interaction needed first):', e));
                }
            }, delay);
        }

        function playSequence() {
            // Intro
            playSound('sfx-whoosh', 200); // Logo
            playSound('sfx-slam', 600);   // Most
            playSound('sfx-slam', 800);   // Played

            // List Items ( Pops )
            playSound('sfx-pop', 1600);
            playSound('sfx-pop', 1700);
            playSound('sfx-pop', 1800);
            playSound('sfx-pop', 1900);
            playSound('sfx-pop', 2000);

            // Outro
            playSound('sfx-outro', 6000);
        }

        function replayAnimation() {
            location.reload();
        }

        // Try to play on load (might be blocked by browser policy without click)
        window.addEventListener('load', () => {
            // We'll let the animation run, sounds might need a click first in some browsers
            // Ideally user clicks "Replay" to get full audio experience
            playSequence();
        });
    </script>

    <div class="stage">
        <!-- INTRO SCENE -->
        <div class="intro-layer">
            <img src="yeah.svg" class="intro-logo" alt="Krew">

            <div class="intro-text-container">
                <div class="intro-text t-most">MOST</div>
                <div class="intro-text t-played">PLAYED</div>
            </div>
        </div>

        <!-- STATS SCENE -->
        <div class="stats-content">
            <header class="stats-header">
                <h1>Your Krew<br>Rewind.</h1>
                <p>Top Tracks • Week 1</p>
            </header>

            <div class="songs-list">
                <!-- 1 -->
                <div class="song-item">
                    <div class="rank">1</div>
                    <img src="song_images/exit music(for a flim).png" class="song-cover">
                    <div class="song-info">
                        <div class="song-title">Exit Music</div>
                        <div class="song-artist">Radiohead</div>
                        <div class="bar-container">
                            <div class="bar-fill"></div>
                        </div>
                    </div>
                    <div class="play-count">1,879</div>
                </div>

                <!-- 2 -->
                <div class="song-item">
                    <div class="rank">2</div>
                    <img src="song_images/high on u.webp" class="song-cover">
                    <div class="song-info">
                        <div class="song-title">High On You</div>
                        <div class="song-artist">Jind Universe</div>
                        <div class="bar-container">
                            <div class="bar-fill"></div>
                        </div>
                    </div>
                    <div class="play-count">808</div>
                </div>

                <!-- 3 -->
                <div class="song-item">
                    <div class="rank">3</div>
                    <img src="song_images/505.webp" class="song-cover">
                    <div class="song-info">
                        <div class="song-title">505</div>
                        <div class="song-artist">Arctic Monkeys</div>
                        <div class="bar-container">
                            <div class="bar-fill"></div>
                        </div>
                    </div>
                    <div class="play-count">703</div>
                </div>

                <!-- 4 -->
                <div class="song-item">
                    <div class="rank">4</div>
                    <img src="song_images/chaandini.webp" class="song-cover">
                    <div class="song-info">
                        <div class="song-title">Chaandni</div>
                        <div class="song-artist">Surf</div>
                        <div class="bar-container">
                            <div class="bar-fill"></div>
                        </div>
                    </div>
                    <div class="play-count">320</div>
                </div>

                <!-- 5 -->
                <div class="song-item">
                    <div class="rank">5</div>
                    <img src="song_images/streets.webp" class="song-cover">
                    <div class="song-info">
                        <div class="song-title">Streets</div>
                        <div class="song-artist">Doja Cat</div>
                        <div class="bar-container">
                            <div class="bar-fill"></div>
                        </div>
                    </div>
                    <div class="play-count">311</div>
                </div>
            </div>

            <div
                style="margin-top: auto; display: flex; align-items: center; justify-content: center; gap: 15px; opacity: 0.6;">
                <img src="yeah.svg" style="height: 40px;">
                <span style="color: white; font-weight: 700; font-size: 24px;">krew</span>
            </div>
        </div>

        <!-- OUTRO SCENE -->
        <div class="outro-layer">
            <div class="outro-text">
                Use Krew.<br>It's Free.
            </div>
            <div class="outro-sub">JOIN THE GANG</div>
            <img src="yeah.svg" class="outro-logo">
        </div>

    </div>

</body>

</html>
